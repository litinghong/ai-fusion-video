[package]
name = "ai-fusion-video-desktop"
version = "0.2.1"
description = "Desktop shell for AI Fusion Video"
authors = ["AI Fusion Video"]
license = "MIT"
repository = "https://github.com/Stonewuu/ai-fusion-video"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_fusion_video_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
